[package]
name = "supersearch"
version = "0.1.8"
description = "A focused offline Windows search launcher"
edition = "2021"
license = "MIT"
repository = "https://github.com/Onlyaiyancc/SuperSearch"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time", "macros", "sync"] }
zxing-cpp = { version = "=0.5.3", features = ["bundled"] }
encoding_rs = "0.8"
csv = "1.4"
ammonia = "4.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "query", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
pinyin = "0.11"
unicode-normalization = "0.1"
windows = { version = "0.61", features = ["Data_Xml_Dom", "Data_Pdf", "Foundation", "Foundation_Collections", "Storage_Streams", "Graphics_Imaging", "UI_Notifications", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 优化解码器的开发构建，同时使 CMake 使用与 Rust 一致的非调试 MSVC CRT。
[profile.dev.package.zxing-cpp]
opt-level = 2

[profile.test.package.zxing-cpp]
opt-level = 2
