version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-patches:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-patches:
        applies-to: version-updates
        patterns: ['*']
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
